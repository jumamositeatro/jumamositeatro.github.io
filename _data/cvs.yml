david:
  name: David Arroyo
  image: nosotros/david.jpg
  description: |
    **David Arroyo** lleva más de diez años en el mundo de la interpretación, aunque montó sus primeras obras en su época escolar.

    Se inició en Cataluña con *Chorus Line*, y con Ramón Molins en *El llibre de Mormó*. En Madrid lleva varios años formándose en Acting Impact Theatre,
    escuela de teatro en inglés con Harriet Thompson y Schuyler Hedstrom, donde ha participado en adaptaciones de obras como
    *Chicago*, *Les Miserables*, *Rent*, *Grease* o *Perfectos desconocidos*, entre otras.
    Además, ha participado en talleres de creación de personaje a través del cuerpo con Nicolás Perez Costa (IFAM), creación escénica con Pablo Messiez (La Sala 25)
    y danza-teatro con José Manjón (Baraka Teatro). Actualmente, continúa su formación en interpretación y escena desde varias
    metodologías con las profesoras Gloria Padura (Observatorio del Futuro) y Blanca Oteyza (EBO).

    Desde 2019 ha participado con la compañía Jumamosi en montajes de adaptaciones de *El Médico* (interpretación),
    *The Book of Mormon* (dirección y producción), *Des-conectad@s* (dirección e interpretación) y *La sirena en la niebla* (interpretación).

andres:
  name: Andrés Viedma
  image: nosotros/andres.jpg
  description: |
    **Andrés** ha participado en el mundo del teatro como actor, dramaturgo y director.

    Como escritor, ha obtenido formación en la escuela
    Fuentetaja (2020-2022), realizando talleres de escritura
    creativa y de novela con profesores como Víctor García
    Antón, Clara Docampo y Gloria Fernández Rozas.

    Como actor, se ha formado en interpretación tanto
    teatral como ante cámara, además de canto y baile en
    Acting escuela de artes escénicas (2022-2026),
    representando obras como *9 to 5*, *El rey de bodas* y *First date*. Se ha
    formado también en interpretación teatral en inglés en
    Acting Impact (2014-2025), participando en obras como
    *Arsénico por compasión*, *Chicago* o
    *Moulin Rouge*. En la escuela Expresando, realizó dos
    cursos intensivos (2017-2018), representando *Los
    Miserables* y *Rent*.

    Dentro de la compañía Jumamosi Teatro, ha escrito y dirigido *La sirena en la niebla* (2024-25), y ha
    actuado y participado en la adaptación del guión
    en obras como *The book of Mormon* (2022-23) y
    *Des-conectad@s* (2023 y 2026). También ha participado en la
    adaptación del guión de *El médico* (2019) para una producción
    independiente, y para Acting Impact en la escritura de
    *The Lonely Hearts Club* (2024) y el corto *Rapunzel, damsel in distress* (2022).
    Dentro del mundo cinematográfico, ha actuado en el corto *Aquello que nos mata* (2026).

elena:
  name: Elena Jurado
  image: nosotros/elena.jpg
  description: |    
    **Elena** ha crecido vinculada al mundo del teatro desde su adolescencia, comenzando con
    pequeños grupos de barrio y de la escuela y más adelante en otras escuelas, como AtUAM
    y Acting Artes Escénicas, mientras cursaba sus estudios y trabajaba. Asimismo, ha
    realizado cursos de dramaturgia y dirección en La Íntegra Teatro con Julio Béjar (2024-
    25), Tamara Berbés y Mikel Marcos (2025-26). Actualmente, se sigue formando en
    interpretación en varias escuelas como Observatorio del Futuro con Gloria Padura, Acting
    Impact Theatre con Harriet Thompson y Schuyler Hedstrom (desde 2013) y Baraka Teatro
    con José Manjón (donde realiza intensivos de danza-teatro y cuerpo poético). También
    recibe clases de canto con la soprano Marianne Cardoso.

    Como actriz, ha participado en clásicos como *Historia de una escalera*, *Prohibido suicidarse
    en primavera* o *La casa de Bernarda Alba*. También ha formado parte en adaptaciones de
    musicales como *Chicago*, *West Side Story*, *Cabaret*, *Les Miserables*, *Rent*, *Grease*, *Addams Family* o *Rocky Horror Picture Show*
    y obras como *Arsenic and old lace* o *Tony&Tina’s wedding*, así como de otras obras independientes, como *Por nosotras* (2008)
    o *El Viaje de Rob* (2019), donde también formó parte de la escenografía y guión.

    Como dramaturga y directora, ha creado las obras *El Titiritero* (2016), *El viaje de Rob* (2019, en colaboración con otros), *La
    decisión de Matilde* (2024-25), *Las mirandas* (2023-26, con otros) y *Des-habitada* (2026).

    Dentro de la compañía Jumamosi Teatro, ha participado en el montaje, escenografía e interpretación de 
    *The book of Mormon* (2022-23), *Des-conectad@s* (2023 y 2026) y *La sirena en la niebla* (2024-25).

    Desde niña, escribe teatro, relatos y poesía y perteneció al grupo de escritura creativa formado por mujeres del Centro de
    Igualdad María Zambrano, “Tinta Violeta”, que publicó un libro recopilatorio en 2025.
