  aboutcard:
    imageurl: deshabitada/cartel.jpg 
    text: |
      Una habitación solitaria. Cosas por todas partes.
      Parece que su dueña está a punto de regresar.

      Pero... Alicia no vuelve.

      Sin embargo, estas cuatro paredes están llenas de vida.

      A través de las historias, relaciones y conjeturas narradas por sus pertenencias más queridas, iremos averiguando el misterio de su desaparición. Y puede que algo más.

      Un cuarto compartido por el suspense, el humor, el drama... Y los secretos guardados.

      Un actual y tierno relato sobre la salud mental.

      ---

