  aboutcard:
    imageurl: desconectados/cartel.jpg 
    text: |
      Siete amigos, siete móviles y demasiados secretos para compartir.

      Una cena entre amigos, unos móviles sobre la mesa y una propuesta que parece inofensiva: compartir cada mensaje, cada llamada y cada secreto que llegue durante la velada. ¿Qué podría salir mal?
 
      En Des-conectad@s, lo que comienza como un juego pronto se convierte en una bomba de relojería. Entre risas, sospechas y revelaciones inesperadas, las certezas se tambalean y las relaciones empiezan a resquebrajarse. Porque todos tenemos algo que ocultar y, a veces, la distancia entre la verdad y la mentira cabe en una pantalla.
 
      Una dramedia sobre la amistad, la intimidad y los secretos que quizá nunca deberían salir a la luz.

      ---

      Duración: 60 minutos aprox.

      Edad recomendada: 16+

