name: Rename Sitemap for GSC

on:
  push:
    branches:
      - main

jobs:
  copy-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy sitemap.xml to sitemap-web.xml
        run: |
          if [ -f "sitemap.xml" ]; then
            cp sitemap.xml sitemap-web.xml
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add sitemap-web.xml
            git commit -m "Auto-copy sitemap.xml to sitemap-web.xml for GSC" || echo "No changes to commit"
            git push
          fi
